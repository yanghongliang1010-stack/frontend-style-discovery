<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Frontend Style Discovery</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="showcase.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-theme="dark">
    <div class="scene-frame"><div id="scene"></div></div>
    <header>
      <a href="./">Frontend<br />Style Discovery</a>
      <div class="controls">
        <button id="theme">切换为日光</button><a href="gallery/">打开选图册</a
        ><button id="open-film">播放宣传片</button>
      </div>
    </header>
    <main>
      <div id="copy">
        <h1>先选风格。<br />再写界面。</h1>
        <p id="description">
          通过真实案例、多轮反馈与风格组合，<br />把模糊的想法变成完整的前端设计。
        </p>
        <a class="main-link" href="gallery/">开始选择参考</a>
      </div>
    </main>
    <div id="sources" hidden>
      <p>参考原作</p>
      <div>12 <strong>KODE Immersive</strong></div>
      <div>10 <strong>Lusion</strong></div>
      <div>11 <strong>Igloo</strong></div>
      <small>本片场景、镜头和声音为原创制作</small>
    </div>
    <div id="axes" hidden>
      <span>3D 材质与光线</span><span>杂志排版与编辑器</span
      ><span>颜色与快捷操作</span>
    </div>
    <div id="concepts" hidden>
      <figure>
        <img
          src="../examples/media/commonplace-editorial.png"
          alt="原创杂志式灵感库概念"
        />
        <figcaption>方向 A · 杂志式排版</figcaption>
      </figure>
      <figure>
        <img
          src="../examples/media/commonplace-spatial.png"
          alt="原创空间画布概念"
        />
        <figcaption>方向 B · 空间画布</figcaption>
      </figure>
    </div>
    <footer>
      <span id="footer-copy">$frontend-style-discovery</span
      ><a
        href="https://github.com/yanghongliang1010-stack/frontend-style-discovery"
        >GitHub / frontend-style-discovery</a
      >
    </footer>
    <dialog id="film">
      <button id="close-film">关闭</button
      ><video
        controls
        preload="metadata"
        poster="../media/poster.png"
        src="../media/frontend-style-discovery.mp4"
      ></video>
    </dialog>
    <script type="module" src="showcase.js"></script>
  </body>
</html>
