name: Check reusable skill and tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 -m unittest discover -s tests -v
      - run: npm run gallery
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-gallery.mjs
      - run: node scripts/verify-showcase.mjs
      - run: node scripts/verify-round-trip.mjs
      - run: node --check demo/sculpture.js && node --check demo/showcase.js && node --check scripts/render-video.mjs && node --check skills/frontend-style-discovery/assets/gallery/gallery.js
      - run: npx prettier --check README.md README.zh-CN.md CONTRIBUTING.md docs skills demo scripts/*.mjs examples/*.json package.json .github/workflows/check.yml
